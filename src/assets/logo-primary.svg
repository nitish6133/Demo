<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FutureFrame logo">
  <title>FutureFrame</title>
  <defs>
    <linearGradient id="ff-grad" x1="24" y1="16" x2="104" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A90E2"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="out" result="soft"/>
      <feBlend in="SourceGraphic" in2="soft" mode="normal"/>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(16,16)">
    <!-- Frame -->
    <rect x="0" y="0" width="128" height="128" rx="20" fill="white" stroke="#1A1A40" stroke-width="4"/>
    <!-- Lens ring -->
    <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ff-grad)" stroke-width="10"/>
    <!-- Rising sun / future arc -->
    <path d="M28 78a36 36 0 0 1 72 0" fill="none" stroke="#4A90E2" stroke-width="6" stroke-linecap="round"/>
    <!-- Up arrow (aspiration) -->
    <path d="M64 40 L64 22 M64 22 L56 30 M64 22 L72 30" stroke="#F5A623" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <!-- Shutter hint -->
    <path d="M64 50 l14 8 -6 16 h-16 l-6 -16 14 -8z" fill="#1A1A40" opacity="0.06"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(168,42)">
    <text x="0" y="48" font-family="Poppins, Nunito, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="56" font-weight="700" letter-spacing="0.5">
      <tspan fill="#1A1A40">Future</tspan><tspan fill="#4A90E2">Frame</tspan>
    </text>
    <text x="2" y="86" font-family="Poppins, Nunito, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="18" fill="#6B7280" letter-spacing="0.8">
      See Their Tomorrow, Today
    </text>
  </g>
</svg>